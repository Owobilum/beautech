name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read # nx-set-shas looks up the last successful run on main
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for `nx affected`
          filter: tree:0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE/NX_HEAD: the PR base, or the last successful run on main.
      # With no successful run yet, compare against main before this push
      # (rather than HEAD~1), so every pushed commit is checked.
      - uses: nrwl/nx-set-shas@v5
        with:
          fallback-sha: ${{ github.event.before }}

      - run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      # PRs that change a published package must include a changeset
      # (`npx changeset`). Skipped on the bot's "Version Packages" PR, which
      # consumes the changesets.
      - name: Check for changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: npx changeset status --since=origin/main

      # Chromium for the Storybook story tests (Vitest browser mode) and the
      # chat app's Playwright e2e tests.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # e2e runs the chat app against its mock AI provider: no API key needed.
      - run: npx nx affected -t lint typecheck build build-storybook e2e

      # Separate run so --coverage reaches only the test targets. Vitest
      # thresholds (in each project's config) fail this step on a regression.
      - run: npx nx affected -t test --coverage

      # Only affected projects produce a report; codecov.yml carries the
      # others forward. Uploads don't fail CI (no token on fork PRs).
      - name: Upload ui coverage
        if: ${{ !cancelled() && hashFiles('packages/ui/test-output/vitest/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/ui/test-output/vitest/coverage/lcov.info
          disable_search: true
          flags: ui
      - name: Upload chat coverage
        if: ${{ !cancelled() && hashFiles('apps/chat/test-output/vitest/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/chat/test-output/vitest/coverage/lcov.info
          disable_search: true
          flags: chat

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    # Secrets aren't available to PRs from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic uses git history to find baselines

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Visual changes don't fail this job (exitZeroOnChanges); they are
      # reviewed via Chromatic's "UI Tests" check. main auto-accepts.
      - run: npx nx run storybook:chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
