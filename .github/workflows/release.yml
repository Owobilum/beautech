name: Release

on:
  push:
    branches:
      - main

# Never run two releases at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit, tags, GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Writes an .npmrc mapping @owobilum to GitHub Packages, authenticated
      # with NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@owobilum'

      - run: npm ci

      # With pending changesets: opens/updates the "Version Packages" PR.
      # When that PR is merged (no changesets left): builds and publishes any
      # package version not yet in GitHub Packages, then tags and creates
      # GitHub releases.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          # Read by @changesets/changelog-github to link PRs and authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
