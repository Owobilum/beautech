# Codecov: https://docs.codecov.com/docs/codecov-yaml
# CI uploads one lcov report per affected project (see .github/workflows/ci.yml).
# The hard gate is the Vitest thresholds; these checks are informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  ui:
    paths:
      - packages/ui/src/
    carryforward: true # unaffected projects keep their last report
  chat:
    paths:
      - apps/chat/src/
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, condensed_files'
  require_changes: false
